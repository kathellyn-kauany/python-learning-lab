<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Cursos - Python Learning Lab" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#00995D" opacity="0.16" />
    </pattern>

    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00995D" stop-opacity="0.45" />
      <stop offset="55%" stop-color="#00995D" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#00995D" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00995D" stop-opacity="0" />
      <stop offset="18%" stop-color="#00995D" stop-opacity="0.55" />
      <stop offset="82%" stop-color="#00995D" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#00995D" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <style>
      .mono { font-family: "JetBrains Mono","Fira Code","Cascadia Mono","Consolas","Courier New",monospace; }
      .sans { font-family: "Inter","Segoe UI","Helvetica Neue",Arial,sans-serif; }
      .lt { fill: #EAFBF2; }
      .ac { fill: #00995D; }
    </style>
  </defs>

  <!-- fundo -->
  <rect width="1200" height="300" fill="#0D1117" />
  <rect width="1200" height="300" fill="url(#grid)" />
  <rect x="0.5" y="0.5" width="1199" height="299" fill="none" stroke="#00995D" stroke-opacity="0.35" />
  <path d="M0 0 H60 M0 0 V60" stroke="#00995D" stroke-opacity="0.8" stroke-width="2" fill="none" />
  <path d="M1200 300 H1140 M1200 300 V240" stroke="#00995D" stroke-opacity="0.8" stroke-width="2" fill="none" />

  <!-- divisoria -->
  <rect x="352" y="36" width="1" height="228" fill="url(#rule)" />

  <!-- halo + anel orbital -->
  <circle cx="170" cy="154" r="96" fill="url(#halo)">
    <animate attributeName="r" values="92;102;92" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.75;1;0.75" dur="5s" repeatCount="indefinite" />
  </circle>
  <ellipse cx="170" cy="154" rx="104" ry="34" fill="none" stroke="#00995D" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4 7">
    <animateTransform attributeName="transform" type="rotate" from="0 170 154" to="360 170 154" dur="26s" repeatCount="indefinite" />
  </ellipse>

  <!-- icone -->
  <g filter="url(#glow)">
    <path d="M110 124 Q140 112 170 128 V190 Q140 174 110 186 Z" fill="none" stroke="#00995D" stroke-width="2.2" stroke-linejoin="round" />
    <path d="M230 124 Q200 112 170 128 V190 Q200 174 230 186 Z" fill="none" stroke="#00995D" stroke-width="2.2" stroke-linejoin="round" />
    <path d="M124 142 Q142 136 158 144 M124 158 Q142 152 158 160 M216 142 Q198 136 182 144 M216 158 Q198 152 182 160" fill="none" stroke="#00995D" stroke-opacity="0.6" stroke-width="1.4" stroke-linecap="round" />
  </g>

  <!-- particulas -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 170 154" to="360 170 154" dur="18s" repeatCount="indefinite" />
    <circle cx="274" cy="154" r="2.4" fill="#EAFBF2"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.7s" repeatCount="indefinite" /></circle>
    <circle cx="170" cy="62" r="2" fill="#00995D"><animate attributeName="opacity" values="1;0.15;1" dur="2.3s" repeatCount="indefinite" /></circle>
    <circle cx="66" cy="154" r="2.2" fill="#EAFBF2"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.9s" repeatCount="indefinite" /></circle>
    <circle cx="170" cy="246" r="1.8" fill="#00995D"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.3s" repeatCount="indefinite" /></circle>
  </g>

  <!-- texto -->
  <text class="mono ac" x="396" y="78" font-size="11" letter-spacing="3">// CATEGORIA</text>

  <text class="mono lt" x="394" y="146" font-size="50" font-weight="700" letter-spacing="2">CURSOS_</text>
  <rect x="396" y="164" width="210" height="2" fill="#00995D" />

  <text class="mono ac" x="396" y="192" font-size="13" letter-spacing="1.6">Formações &amp; Trilhas de Aprendizado</text>

  <text class="sans lt" x="396" y="224" font-size="15" font-weight="600">Anotações, exercícios e projetos de cursos</text>
  <text class="sans lt" x="396" y="246" font-size="15" font-weight="600">e carreiras em Python, organizados por formação.</text>

  <g class="mono">
    <text class="ac" x="396" y="276" font-size="12" opacity="0.85">$ status: estudando</text>
    <rect x="542" y="266" width="8" height="12" fill="#00995D">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
